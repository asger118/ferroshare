<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312E81"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <!-- Mouse-pointer shape, tip at (0,0). -->
    <path id="cursor" d="M0 0 L0 46 L12 35 L21 55 L30 51 L21 31 L37 31 Z"/>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- Code brackets < > -->
  <g fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="72,80 26,128 72,176"/>
    <polyline points="184,80 230,128 184,176"/>
  </g>

  <!-- Two collaborators' cursors -->
  <use href="#cursor" transform="translate(88 80) scale(1.25)" fill="#FB7185" stroke="#1E1B4B" stroke-width="3.5" stroke-linejoin="round"/>
  <use href="#cursor" transform="translate(126 106) scale(1.25)" fill="#5EEAD4" stroke="#1E1B4B" stroke-width="3.5" stroke-linejoin="round"/>
</svg>
