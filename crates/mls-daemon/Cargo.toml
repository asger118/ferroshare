[package]
name = "mls"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.8", features = ["derive"] }
futures-util = "0.3.34"
hex = "0.4.3"
ignore = "0.4.34"
mls-proto = { version = "0.1.0", path = "../mls-proto" }
mls-sync = { version = "0.1.0", path = "../mls-sync" }
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
chacha20poly1305 = "0.11.0"
portable-pty = "0.9.0"

[dev-dependencies]
base64 = "0.23.1"
mls-relay = { path = "../mls-relay" }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
